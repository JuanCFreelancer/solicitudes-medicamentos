<section class="card card-narrow">
  <h1>Crear cuenta</h1>

  @if (errorMessage(); as message) {
    <app-alert type="error">{{ message }}</app-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" formControlName="nombre" autocomplete="name"
             [attr.aria-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid" aria-describedby="nombre-error" />
      <app-field-error [control]="form.controls.nombre" id="nombre-error" />
    </div>

    <div class="form-field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="username"
             [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" aria-describedby="email-error" />
      <app-field-error [control]="form.controls.email" id="email-error" />
    </div>

    <div class="form-field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password"
             [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid" aria-describedby="password-hint password-error" />
      <p class="field-hint" id="password-hint">Mínimo 8 caracteres, con al menos una letra y un número.</p>
      <app-field-error [control]="form.controls.password" id="password-error" />
    </div>

    <div class="form-field">
      <label for="confirmPassword">Confirmar contraseña</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password"
             [attr.aria-invalid]="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid" aria-describedby="confirm-error" />
      <app-field-error [control]="form.controls.confirmPassword" id="confirm-error" />
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Creando cuenta…' : 'Registrarme' }}
    </button>
  </form>

  <p class="form-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</section>
