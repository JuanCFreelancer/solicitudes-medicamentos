<section class="card card-narrow">
  <h1>Iniciar sesión</h1>

  @if (registered()) {
    <app-alert type="success">Cuenta creada correctamente. Ya puedes iniciar sesión.</app-alert>
  }
  @if (expired()) {
    <app-alert type="info">Tu sesión expiró. Vuelve a iniciar sesión para continuar.</app-alert>
  }
  @if (errorMessage(); as message) {
    <app-alert type="error">{{ message }}</app-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="username"
             [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" aria-describedby="email-error" />
      <app-field-error [control]="form.controls.email" id="email-error" />
    </div>

    <div class="form-field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password"
             [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid" aria-describedby="password-error" />
      <app-field-error [control]="form.controls.password" id="password-error" />
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <p class="form-footer">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</section>
