server:
  port: 8082

spring:
  application:
    name: solicitudes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medicamentos}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo gestiona database/schema.sql, Hibernate solo valida
    properties:
      hibernate:
        default_schema: solicitudes

app:
  jwt:
    secret: ${JWT_SECRET}         # mismo secreto que auth-service; sin valor por defecto
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  pagination:
    default-size: 10
    max-size: 50
  notifications:                  # integración con notificaciones-service (composición)
    enabled: ${NOTIFICATIONS_ENABLED:true}
    base-url: ${NOTIFICATIONS_BASE_URL:http://localhost:8083}
    timeout: ${NOTIFICATIONS_TIMEOUT:2s}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"   # cada línea de log lleva el id de correlación

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
